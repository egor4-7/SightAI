<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SightAI — Умная Камера</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Жидкий анимированный фон */
        .liquid-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(126, 34, 206, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 100%);
        }

        /* Эффект жидкого стекла (Liquid Glass) */
        .liquid-glass {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .liquid-glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .liquid-glass-btn:active {
            transform: scale(0.96);
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #60a5fa, #c084fc, transparent);
            box-shadow: 0 0 25px #60a5fa;
            animation: scan 2.5s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-md mx-auto relative">

    <div class="liquid-bg"></div>

    <!-- Шапка -->
    <header class="w-full flex justify-between items-center py-3 z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-xl shadow-xl border border-white/20">
                <i class="fa-solid fa-eye text-white"></i>
            </div>
            <span class="font-extrabold text-2xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-purple-300 to-pink-300">SightAI</span>
        </div>
        <div class="flex gap-2.5">
            <button onclick="openHistory()" class="liquid-glass-btn px-4 py-2.5 rounded-2xl text-base font-semibold text-blue-300 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> История
            </button>
            <button onclick="promptApiKey()" class="liquid-glass-btn px-4 py-2.5 rounded-2xl text-base font-semibold text-yellow-300">
                <i class="fa-solid fa-key"></i>
            </button>
        </div>
    </header>

    <!-- Видеоискатель -->
    <main class="w-full relative flex-1 my-3 flex flex-col justify-center items-center">
        <div class="w-full h-[450px] rounded-3xl overflow-hidden relative liquid-glass shadow-2xl flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <div id="scannerOverlay" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm">
                <div class="scan-line"></div>
            </div>

            <div class="absolute inset-8 border-2 border-white/30 rounded-3xl pointer-events-none flex justify-between flex-col p-3">
                <div class="flex justify-between">
                    <div class="w-6 h-6 border-t-4 border-l-4 border-blue-400 rounded-tl-lg"></div>
                    <div class="w-6 h-6 border-t-4 border-r-4 border-blue-400 rounded-tr-lg"></div>
                </div>
                <div class="flex justify-between">
                    <div class="w-6 h-6 border-b-4 border-l-4 border-blue-400 rounded-bl-lg"></div>
                    <div class="w-6 h-6 border-b-4 border-r-4 border-blue-400 rounded-br-lg"></div>
                </div>
            </div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>
    </main>

    <!-- Режимы -->
    <div class="w-full flex justify-between gap-2.5 overflow-x-auto py-3 px-1 no-scrollbar z-10">
        <button onclick="setMode('auto')" id="mode-auto" class="mode-btn px-4 py-3 rounded-2xl text-base font-bold bg-blue-600 text-white shrink-0 shadow-lg border border-white/30">✨ Авто</button>
        <button onclick="setMode('food')" id="mode-food" class="mode-btn px-4 py-3 rounded-2xl text-base font-bold liquid-glass-btn text-gray-200 shrink-0">🥗 Калории</button>
        <button onclick="setMode('history')" id="mode-history" class="mode-btn px-4 py-3 rounded-2xl text-base font-bold liquid-glass-btn text-gray-200 shrink-0">🏛️ История</button>
        <button onclick="setMode('math')" id="mode-math" class="mode-btn px-4 py-3 rounded-2xl text-base font-bold liquid-glass-btn text-gray-200 shrink-0">📐 Формулы</button>
        <button onclick="setMode('health')" id="mode-health" class="mode-btn px-4 py-3 rounded-2xl text-base font-bold liquid-glass-btn text-gray-200 shrink-0">🩺 Здоровье</button>
    </div>

    <!-- Кнопка съемки -->
    <div class="w-full flex justify-center items-center my-4 z-10">
        <button onclick="captureAndAnalyze()" class="w-24 h-24 rounded-full p-1.5 flex items-center justify-center liquid-glass-btn shadow-2xl active:scale-90 transition">
            <div class="w-full h-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 rounded-full flex items-center justify-center text-white text-3xl shadow-inner border border-white/40">
                <i class="fa-solid fa-camera"></i>
            </div>
        </button>
    </div>

    <!-- Модальное окно результата -->
    <div id="resultModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="liquid-glass rounded-3xl p-6 max-h-[82vh] overflow-y-auto flex flex-col gap-5 border border-white/30 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/15 pb-4">
                <h3 class="text-xl font-extrabold text-blue-300 flex items-center gap-3">
                    <i class="fa-solid fa-sparkles"></i> Результат анализа
                </h3>
                <button onclick="closeModal('resultModal')" class="w-10 h-10 rounded-full liquid-glass-btn flex items-center justify-center text-gray-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="resultContent" class="text-lg leading-relaxed text-gray-100 whitespace-pre-line font-medium"></div>
            <button onclick="closeModal('resultModal')" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg shadow-xl transition mt-2 border border-white/30">Готово</button>
        </div>
    </div>

    <!-- Модальное окно истории -->
    <div id="historyModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="liquid-glass rounded-3xl p-6 max-h-[85vh] overflow-y-auto flex flex-col gap-5 border border-white/30 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/15 pb-4">
                <h3 class="text-xl font-extrabold text-blue-300 flex items-center gap-3">
                    <i class="fa-solid fa-clock-rotate-left"></i> История сканирования
                </h3>
                <button onclick="closeModal('historyModal')" class="w-10 h-10 rounded-full liquid-glass-btn flex items-center justify-center text-gray-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="historyList" class="flex flex-col gap-4"></div>
        </div>
    </div>

    <script>
        let currentMode = 'auto';
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let historyData = JSON.parse(localStorage.getItem('omni_history') || '[]');

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert("Ошибка доступа к камере.");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-4 py-3 rounded-2xl text-base font-bold liquid-glass-btn text-gray-200 shrink-0';
            });
            document.getElementById(`mode-${mode}`).className = 'mode-btn px-4 py-3 rounded-2xl text-base font-bold bg-blue-600 text-white shrink-0 shadow-lg border border-white/30';
        }

        function promptApiKey() {
            const key = prompt("Введите ваш Gemini API Key:", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
            }
        }

        const prompts = {
            auto: "Определи, что находится на изображении. Дай исчерпывающее и структурированное описание на русском языке.",
            food: "Определи еду на изображении. Рассчитай примерный вес, калорийность (Ккал) и БЖУ. На русском языке.",
            history: "Определи исторический объект или памятник на фото. Расскажи его историю и факты. На русском языке.",
            math: "Найди формулу или задачу на фото. Запиши условие и дай пошаговое подробное решение. На русском языке.",
            health: "Проанализируй признаки или состояние на фото. Опиши возможные причины и рекомендации. Обязательно напомни про врача. На русском языке."
        };

        async function captureAndAnalyze() {
            if (!apiKey) {
                promptApiKey();
                if (!apiKey) return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            const base64Data = base64Image.split(',')[1];

            document.getElementById('scannerOverlay').classList.remove('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('resultContent').innerText = "🔍 SightAI анализирует снимок...";

            // Актуальный список моделей Google Gemini
            const candidateModels = [
                "gemini-3.8-flash",
                "gemini-2.5-flash",
                "gemini-1.5-flash"
            ];

            let success = false;
            let lastError = "";

            for (const model of candidateModels) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompts[currentMode] },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        const resultText = data.candidates[0].content.parts[0].text;
                        document.getElementById('resultContent').innerText = resultText;

                        const newItem = {
                            image: base64Image,
                            mode: currentMode,
                            text: resultText,
                            date: new Date().toLocaleString()
                        };
                        historyData.unshift(newItem);
                        if (historyData.length > 20) historyData.pop();
                        localStorage.setItem('omni_history', JSON.stringify(historyData));

                        success = true;
                        break;
                    } else if (data.error) {
                        lastError = `[${model}]: ${data.error.message}`;
                    }
                } catch (e) {
                    lastError = e.message;
                }
            }

            document.getElementById('scannerOverlay').classList.add('hidden');

            if (!success) {
                document.getElementById('resultContent').innerText = `Не удалось связаться с моделью.\n\nОшибка:\n${lastError}\n\nПроверьте правильность API ключа.`;
            }
        }

        function openHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (historyData.length === 0) {
                list.innerHTML = '<p class="text-base text-gray-400 text-center py-8">История пуста. Сделайте первый снимок!</p>';
            } else {
                historyData.forEach((item) => {
                    list.innerHTML += `
                        <div class="liquid-glass p-3.5 rounded-2xl border border-white/20 flex gap-4 items-center">
                            <img src="${item.image}" class="w-20 h-20 object-cover rounded-xl shrink-0 border border-white/20">
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <span class="text-xs text-blue-300 font-bold uppercase tracking-wider">${item.mode} • ${item.date}</span>
                                <p class="text-sm text-gray-200 truncate mt-1.5 font-medium">${item.text}</p>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        window.onload = initCamera;
    </script>
</body>
</html>
