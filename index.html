<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SightAI — Умная Камера (v2.7)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* Жидкий анимированный фон */
        .liquid-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(126, 34, 206, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 100%);
        }

        /* Эффект жидкого стекла (Liquid Glass) */
        .liquid-glass {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .liquid-glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .liquid-glass-btn:active {
            transform: scale(0.96);
        }

        /* Полное блокирование элементов плеера и касаний видео в iOS */
        video {
            pointer-events: none !important;
        }
        video::-webkit-media-controls,
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-start-playback-button {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #60a5fa, #c084fc, transparent);
            box-shadow: 0 0 25px #60a5fa;
            animation: scan 2.5s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-3 max-w-md mx-auto relative">

    <div class="liquid-bg"></div>

    <!-- Шапка (уменьшенный логотип и отступы) -->
    <header class="w-full flex justify-between items-center py-1.5 z-10">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-base shadow-lg border border-white/20">
                <i class="fa-solid fa-eye text-white"></i>
            </div>
            <span class="font-extrabold text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-purple-300 to-pink-300">SightAI</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-[11px] font-bold text-blue-400 bg-blue-500/10 border border-blue-400/30 px-2 py-0.5 rounded-full">v2.7</span>
            <button onclick="openHistory()" class="liquid-glass-btn px-3 py-2 rounded-xl text-sm font-semibold text-blue-300 flex items-center gap-1">
                <i class="fa-solid fa-clock-rotate-left"></i> История
            </button>
            <button onclick="promptApiKey()" class="liquid-glass-btn px-2.5 py-2 rounded-xl text-sm font-semibold text-yellow-300" title="API Ключ">
                <i class="fa-solid fa-key"></i>
            </button>
            <button onclick="forceSync()" class="liquid-glass-btn px-2.5 py-2 rounded-xl text-sm font-semibold text-emerald-300" title="Синхронизация">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </header>

    <!-- Видеоискатель (оптимизированная высота для баланса экрана) -->
    <main class="w-full relative my-1 flex flex-col justify-center items-center">
        <div class="w-full h-[390px] rounded-3xl overflow-hidden relative liquid-glass shadow-2xl flex items-center justify-center">
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div id="scannerOverlay" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm">
                <div class="scan-line"></div>
            </div>

            <div class="absolute inset-6 border-2 border-white/30 rounded-2xl pointer-events-none flex justify-between flex-col p-2">
                <div class="flex justify-between">
                    <div class="w-5 h-5 border-t-4 border-l-4 border-blue-400 rounded-tl-lg"></div>
                    <div class="w-5 h-5 border-t-4 border-r-4 border-blue-400 rounded-tr-lg"></div>
                </div>
                <div class="flex justify-between">
                    <div class="w-5 h-5 border-b-4 border-l-4 border-blue-400 rounded-bl-lg"></div>
                    <div class="w-5 h-5 border-b-4 border-r-4 border-blue-400 rounded-br-lg"></div>
                </div>
            </div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>
    </main>

    <!-- Режимы (приподняты выше) -->
    <div class="w-full flex justify-between gap-2 overflow-x-auto py-1 px-1 no-scrollbar z-10">
        <button onclick="setMode('auto')" id="mode-auto" class="mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold bg-blue-600 text-white shrink-0 shadow-lg border border-white/30">✨ Авто</button>
        <button onclick="setMode('food')" id="mode-food" class="mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold liquid-glass-btn text-gray-200 shrink-0">🥗 Калории</button>
        <button onclick="setMode('history')" id="mode-history" class="mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold liquid-glass-btn text-gray-200 shrink-0">🏛️ История</button>
        <button onclick="setMode('math')" id="mode-math" class="mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold liquid-glass-btn text-gray-200 shrink-0">📐 Формулы</button>
        <button onclick="setMode('health')" id="mode-health" class="mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold liquid-glass-btn text-gray-200 shrink-0">🩺 Здоровье</button>
    </div>

    <!-- Кнопка съемки (поднята ближе к режимам) -->
    <div class="w-full flex justify-center items-center my-1 z-10">
        <button onclick="captureAndAnalyze()" class="w-20 h-20 rounded-full p-1 flex items-center justify-center liquid-glass-btn shadow-2xl active:scale-90 transition">
            <div class="w-full h-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 rounded-full flex items-center justify-center text-white text-2xl shadow-inner border border-white/40">
                <i class="fa-solid fa-camera"></i>
            </div>
        </button>
    </div>

    <!-- Модальное окно результата -->
    <div id="resultModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="liquid-glass rounded-3xl p-6 max-h-[82vh] overflow-y-auto flex flex-col gap-5 border border-white/30 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/15 pb-4">
                <h3 class="text-xl font-extrabold text-blue-300 flex items-center gap-3">
                    <i class="fa-solid fa-sparkles"></i> Результат анализа
                </h3>
                <!-- Кнопка закрытия (крестик) -->
                <button id="modalCloseBtn" onclick="closeModal('resultModal')" class="w-10 h-10 rounded-full liquid-glass-btn flex items-center justify-center text-gray-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="resultContent" class="text-lg leading-relaxed text-gray-100 whitespace-pre-line font-medium"></div>
            <!-- Кнопка Готово -->
            <button id="modalActionBtn" onclick="closeModal('resultModal')" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg shadow-xl transition mt-2 border border-white/30">Готово</button>
        </div>
    </div>

    <!-- Модальное окно истории -->
    <div id="historyModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="liquid-glass rounded-3xl p-6 max-h-[85vh] overflow-y-auto flex flex-col gap-5 border border-white/30 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/15 pb-4">
                <h3 class="text-xl font-extrabold text-blue-300 flex items-center gap-3">
                    <i class="fa-solid fa-clock-rotate-left"></i> История сканирования
                </h3>
                <button onclick="closeModal('historyModal')" class="w-10 h-10 rounded-full liquid-glass-btn flex items-center justify-center text-gray-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="historyList" class="flex flex-col gap-4"></div>
        </div>
    </div>

    <script>
        let currentMode = 'auto';
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let historyData = JSON.parse(localStorage.getItem('omni_history') || '[]');

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert("Ошибка доступа к камере.");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold liquid-glass-btn text-gray-200 shrink-0';
            });
            document.getElementById(`mode-${mode}`).className = 'mode-btn px-3.5 py-2.5 rounded-xl text-sm font-bold bg-blue-600 text-white shrink-0 shadow-lg border border-white/30';
        }

        function promptApiKey() {
            const key = prompt("Введите ваш Gemini API Key:", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
            }
        }

        function forceSync() {
            if (confirm("Выполнить синхронизацию и обновить приложение?")) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for(let registration of registrations) { registration.unregister(); }
                    });
                }
                const cleanUrl = window.location.href.split('?')[0];
                window.location.replace(cleanUrl + '?v=' + Date.now());
            }
        }

        const prompts = {
            auto: "Определи, что находится на изображении. Дай исчерпывающее и структурированное описание на русском языке.",
            food: "Определи еду на изображении. Рассчитай примерный вес, калорийность (Ккал) и БЖУ. На русском языке.",
            history: "Определи исторический объект или памятник на фото. Расскажи его историю и факты. На русском языке.",
            math: "Найди формулу или задачу на фото. Запиши условие и дай пошаговое подробное решение. На русском языке.",
            health: "Проанализируй признаки или состояние на фото. Опиши возможные причины и рекомендации. Обязательно напомни про врача. На русском языке."
        };

        async function captureAndAnalyze() {
            if (!apiKey) {
                promptApiKey();
                if (!apiKey) return;
            }

            const MAX_SIZE = 800;
            let w = video.videoWidth || 640;
            let h = video.videoHeight || 480;
            if (w > MAX_SIZE || h > MAX_SIZE) {
                if (w > h) {
                    h = Math.round((h * MAX_SIZE) / w);
                    w = MAX_SIZE;
                } else {
                    w = Math.round((w * MAX_SIZE) / h);
                    h = MAX_SIZE;
                }
            }

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.7);
            const base64Data = base64Image.split(',')[1];

            // СКРЫВАЕМ крестик и кнопку "Готово" на время анализа
            document.getElementById('modalCloseBtn').classList.add('hidden');
            document.getElementById('modalActionBtn').classList.add('hidden');

            document.getElementById('scannerOverlay').classList.remove('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('resultContent').innerText = "🔍 SightAI анализирует снимок...";

            const candidateModels = [
                "gemini-3.8-flash",
                "gemini-2.5-flash",
                "gemini-1.5-flash"
            ];

            let success = false;

            for (const model of candidateModels) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 12000);

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompts[currentMode] },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);
                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        const resultText = data.candidates[0].content.parts[0].text;
                        document.getElementById('resultContent').innerText = resultText;

                        const newItem = {
                            image: base64Image,
                            mode: currentMode,
                            text: resultText,
                            date: new Date().toLocaleString()
                        };
                        historyData.unshift(newItem);
                        if (historyData.length > 20) historyData.pop();
                        localStorage.setItem('omni_history', JSON.stringify(historyData));

                        success = true;
                        break;
                    }
                } catch (e) {
                    // Игнорируем и пробуем следующую модель
                }
            }

            document.getElementById('scannerOverlay').classList.add('hidden');

            // ВОЗВРАЩАЕМ крестик и кнопку "Готово" после завершения анализа
            document.getElementById('modalCloseBtn').classList.remove('hidden');
            document.getElementById('modalActionBtn').classList.remove('hidden');

            if (!success) {
                document.getElementById('resultContent').innerText = "Не удалось произвести анализ, повторите попытку!";
            }
        }

        function openHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (historyData.length === 0) {
                list.innerHTML = '<p class="text-base text-gray-400 text-center py-8">История пуста. Сделайте первый снимок!</p>';
            } else {
                historyData.forEach((item) => {
                    list.innerHTML += `
                        <div class="liquid-glass p-3.5 rounded-2xl border border-white/20 flex gap-4 items-center">
                            <img src="${item.image}" class="w-20 h-20 object-cover rounded-xl shrink-0 border border-white/20">
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <span class="text-xs text-blue-300 font-bold uppercase tracking-wider">${item.mode} • ${item.date}</span>
                                <p class="text-sm text-gray-200 truncate mt-1.5 font-medium">${item.text}</p>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        window.onload = initCamera;
    </script>
</body>
</html>
