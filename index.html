<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniVision AI — Камера Распознавания</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(20, 24, 33, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
            box-shadow: 0 0 15px #3b82f6;
            animation: scan 2.5s infinite linear;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-md mx-auto relative overflow-hidden">

    <!-- Заголовок -->
    <header class="w-full flex justify-between items-center py-2 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-sm shadow-lg">
                <i class="fa-solid fa-eye"></i>
            </div>
            <span class="font-extrabold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">OmniVision</span>
        </div>
        <button id="apiKeyBtn" onclick="promptApiKey()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 transition">
            <i class="fa-solid fa-key text-yellow-400 mr-1"></i> API Ключ
        </button>
    </header>

    <!-- Видеоискатель камеры -->
    <main class="w-full relative flex-1 my-3 flex flex-col justify-center items-center">
        <div class="w-full h-[420px] rounded-3xl overflow-hidden relative glass-card shadow-2xl flex items-center justify-center">
            <!-- Видео с веб-камеры -->
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <!-- Анимация сканирования (скрыта по умолчанию) -->
            <div id="scannerOverlay" class="hidden absolute inset-0 bg-black/30">
                <div class="scan-line"></div>
            </div>

            <!-- Рамка сфокусированности -->
            <div class="absolute inset-8 border-2 border-white/20 rounded-2xl pointer-events-none flex justify-between flex-col p-2">
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-t-2 border-l-2 border-blue-400"></div>
                    <div class="w-4 h-4 border-t-2 border-r-2 border-blue-400"></div>
                </div>
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-b-2 border-l-2 border-blue-400"></div>
                    <div class="w-4 h-4 border-b-2 border-r-2 border-blue-400"></div>
                </div>
            </div>
        </div>

        <canvas id="canvas" class="hidden"></canvas>
    </main>

    <!-- Выбор режима анализа -->
    <div class="w-full flex justify-between gap-2 overflow-x-auto py-2 px-1 z-10 no-scrollbar">
        <button onclick="setMode('auto')" id="mode-auto" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shrink-0 shadow-lg">
            ✨ Авто-скан
        </button>
        <button onclick="setMode('food')" id="mode-food" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">
            🥗 Калории
        </button>
        <button onclick="setMode('history')" id="mode-history" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">
            🏛️ История
        </button>
        <button onclick="setMode('math')" id="mode-math" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">
            📐 Формулы
        </button>
        <button onclick="setMode('health')" id="mode-health" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">
            🩺 Здоровье
        </button>
    </div>

    <!-- Кнопка снимка -->
    <div class="w-full flex justify-center items-center my-3 z-10">
        <button onclick="captureAndAnalyze()" class="w-20 h-20 rounded-full border-4 border-white/30 p-1 flex items-center justify-center active:scale-95 transition">
            <div class="w-full h-full bg-gradient-to-tr from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-solid fa-camera"></i>
            </div>
        </button>
    </div>

    <!-- Модальное окно результата -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="glass-card rounded-3xl p-6 max-h-[80vh] overflow-y-auto flex flex-col gap-4 border border-white/20 animate-slide-up">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-sparkles"></i> Результат анализа
                </h3>
                <button onclick="closeResult()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-300 hover:bg-white/20">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="resultContent" class="text-sm leading-relaxed text-gray-200 whitespace-pre-line font-medium">
                Анализируем изображение...
            </div>

            <button onclick="closeResult()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-sm shadow-lg transition mt-2">
                Закрыть
            </button>
        </div>
    </div>

    <script>
        let currentMode = 'auto';
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        // Инициализация камеры
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Ошибка доступа к камере:", err);
                alert("Не удалось получить доступ к камере. Пожалуйста, разрешите доступ в настройках.");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0';
            });
            document.getElementById(`mode-${mode}`).className = 'mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shrink-0 shadow-lg';
        }

        function promptApiKey() {
            const key = prompt("Введите ваш Gemini API Key:", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
            }
        }

        // Промпты под разные задачи
        const prompts = {
            auto: "Определи, что находится на изображении. Дай исчерпывающее и структурированное описание на русском языке.",
            food: "Определи еду на изображении. Рассчитай примерный вес, калорийность (Ккал) и БЖУ (белки, жиры, углеводы). Отвечай на русском языке.",
            history: "Определи исторический объект, здание или памятник архитектуры на фото. Расскажи его историю, дату постройки и ключевые факты на русском языке.",
            math: "Найди математическую формулу или задачу на изображении. Запиши ее условие и дай пошаговое подробное решение на русском языке.",
            health: "Проанализируй видимые внешние признаки или физиологическое состояние на фото. Опиши возможные причины и список рекомендаций. Обязательно напомни про необходимость обращения к врачу. На русском языке."
        };

        async function captureAndAnalyze() {
            if (!apiKey) {
                promptApiKey();
                if (!apiKey) return;
            }

            // Делаем снимок
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            // Включаем анимацию сканера
            document.getElementById('scannerOverlay').classList.remove('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('resultContent').innerText = "🔍 ИИ распознает объект на фото...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompts[currentMode] },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('scannerOverlay').classList.add('hidden');

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('resultContent').innerText = data.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById('resultContent').innerText = "Ошибка распознавания или некорректный ответ от API.";
                }
            } catch (err) {
                document.getElementById('scannerOverlay').classList.add('hidden');
                document.getElementById('resultContent').innerText = "Произошла ошибка при отправке запроса. Проверьте API ключ и подключение к интернету.";
                console.error(err);
            }
        }

        function closeResult() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        window.onload = initCamera;
    </script>
</body>
</html>
