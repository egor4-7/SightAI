<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SightAI — Камера ИИ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(20, 24, 33, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
            box-shadow: 0 0 15px #3b82f6;
            animation: scan 2.5s infinite linear;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-md mx-auto relative overflow-hidden">

    <!-- Шапка -->
    <header class="w-full flex justify-between items-center py-2 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-sm shadow-lg">
                <i class="fa-solid fa-eye"></i>
            </div>
            <span class="font-extrabold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">SightAI</span>
        </div>
        <div class="flex gap-2">
            <button onclick="openHistory()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 transition flex items-center gap-1">
                <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> История
            </button>
            <button onclick="promptApiKey()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 transition">
                <i class="fa-solid fa-key text-yellow-400"></i>
            </button>
        </div>
    </header>

    <!-- Видеоискатель -->
    <main class="w-full relative flex-1 my-3 flex flex-col justify-center items-center">
        <div class="w-full h-[420px] rounded-3xl overflow-hidden relative glass-card shadow-2xl flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <div id="scannerOverlay" class="hidden absolute inset-0 bg-black/30">
                <div class="scan-line"></div>
            </div>

            <div class="absolute inset-8 border-2 border-white/20 rounded-2xl pointer-events-none flex justify-between flex-col p-2">
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-t-2 border-l-2 border-blue-400"></div>
                    <div class="w-4 h-4 border-t-2 border-r-2 border-blue-400"></div>
                </div>
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-b-2 border-l-2 border-blue-400"></div>
                    <div class="w-4 h-4 border-b-2 border-r-2 border-blue-400"></div>
                </div>
            </div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>
    </main>

    <!-- Режимы -->
    <div class="w-full flex justify-between gap-2 overflow-x-auto py-2 px-1 z-10">
        <button onclick="setMode('auto')" id="mode-auto" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shrink-0 shadow-lg">✨ Авто</button>
        <button onclick="setMode('food')" id="mode-food" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">🥗 Калории</button>
        <button onclick="setMode('history')" id="mode-history" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">🏛️ История</button>
        <button onclick="setMode('math')" id="mode-math" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">📐 Формулы</button>
        <button onclick="setMode('health')" id="mode-health" class="mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0">🩺 Здоровье</button>
    </div>

    <!-- Кнопка съемки -->
    <div class="w-full flex justify-center items-center my-3 z-10">
        <button onclick="captureAndAnalyze()" class="w-20 h-20 rounded-full border-4 border-white/30 p-1 flex items-center justify-center active:scale-95 transition">
            <div class="w-full h-full bg-gradient-to-tr from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-solid fa-camera"></i>
            </div>
        </button>
    </div>

    <!-- Модалка результата -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="glass-card rounded-3xl p-6 max-h-[80vh] overflow-y-auto flex flex-col gap-4 border border-white/20">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-sparkles"></i> Результат анализа
                </h3>
                <button onclick="closeModal('resultModal')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="resultContent" class="text-sm leading-relaxed text-gray-200 whitespace-pre-line font-medium"></div>
            <button onclick="closeModal('resultModal')" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-sm shadow-lg transition mt-2">Готово</button>
        </div>
    </div>

    <!-- Модалка истории -->
    <div id="historyModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex flex-col justify-end p-4">
        <div class="glass-card rounded-3xl p-6 max-h-[85vh] overflow-y-auto flex flex-col gap-4 border border-white/20">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i> История сканирования
                </h3>
                <button onclick="closeModal('historyModal')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="historyList" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <script>
        let currentMode = 'auto';
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let historyData = JSON.parse(localStorage.getItem('omni_history') || '[]');

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert("Ошибка доступа к камере.");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-white/10 text-gray-300 hover:bg-white/20 shrink-0';
            });
            document.getElementById(`mode-${mode}`).className = 'mode-btn px-3 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shrink-0 shadow-lg';
        }

        function promptApiKey() {
            const key = prompt("Введите ваш Gemini API Key:", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
            }
        }

        const prompts = {
            auto: "Определи, что находится на изображении. Дай исчерпывающее и структурированное описание на русском языке.",
            food: "Определи еду на изображении. Рассчитай примерный вес, калорийность (Ккал) и БЖУ. На русском языке.",
            history: "Определи исторический объект или памятник на фото. Расскажи его историю и факты. На русском языке.",
            math: "Найди формулу или задачу на фото. Запиши условие и дай пошаговое подробное решение. На русском языке.",
            health: "Проанализируй признаки или состояние на фото. Опиши возможные причины и рекомендации. Обязательно напомни про врача. На русском языке."
        };

        async function captureAndAnalyze() {
            if (!apiKey) {
                promptApiKey();
                if (!apiKey) return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            const base64Data = base64Image.split(',')[1];

            document.getElementById('scannerOverlay').classList.remove('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('resultContent').innerText = "🔍 SightAI анализирует снимок...";

            try {
                // Используем проверенную модель gemini-1.5-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompts[currentMode] },
                                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('scannerOverlay').classList.add('hidden');

                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const resultText = data.candidates[0].content.parts[0].text;
                    document.getElementById('resultContent').innerText = resultText;

                    const newItem = {
                        image: base64Image,
                        mode: currentMode,
                        text: resultText,
                        date: new Date().toLocaleString()
                    };
                    historyData.unshift(newItem);
                    if (historyData.length > 20) historyData.pop();
                    localStorage.setItem('omni_history', JSON.stringify(historyData));
                } else if (data.error) {
                    // Вывод детализированной ошибки сервера
                    document.getElementById('resultContent').innerText = `Ошибка API (${data.error.code}): ${data.error.message}`;
                } else {
                    document.getElementById('resultContent').innerText = "Не удалось распознать объект. Попробуйте сделать снимок при лучшем освещении.";
                }
            } catch (err) {
                document.getElementById('scannerOverlay').classList.add('hidden');
                document.getElementById('resultContent').innerText = "Ошибка подключения к сети или блокировка запроса. Попробуйте включить/выключить VPN.";
            }
        }

        function openHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (historyData.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">История пуста. Сделайте первый снимок!</p>';
            } else {
                historyData.forEach((item) => {
                    list.innerHTML += `
                        <div class="bg-white/5 p-3 rounded-2xl border border-white/10 flex gap-3 items-center">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl shrink-0 border border-white/10">
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <span class="text-[10px] text-blue-400 font-bold uppercase">${item.mode} • ${item.date}</span>
                                <p class="text-xs text-gray-300 truncate mt-1">${item.text}</p>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        window.onload = initCamera;
    </script>
</body>
</html>
